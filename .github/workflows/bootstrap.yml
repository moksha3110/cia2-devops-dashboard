name: One-time EKS namespace bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: '906555057481'
      - name: Connect and bootstrap namespace permissions
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name cia2-devops-dashboard --region ap-south-1
          version=$(curl --fail --silent --show-error --location --retry 3 https://dl.k8s.io/release/stable-1.36.txt)
          curl --fail --silent --show-error --location --retry 3 "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl" -o "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location --retry 3 "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256" -o "$RUNNER_TEMP/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/kubectl.sha256")" "$RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kubectl"
          "$RUNNER_TEMP/kubectl" apply -f k8s/rbac.yaml
          "$RUNNER_TEMP/kubectl" get nodepools
          "$RUNNER_TEMP/kubectl" auth can-i create deployments -n devops-dashboard
